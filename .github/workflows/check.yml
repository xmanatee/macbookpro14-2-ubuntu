name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q scripts touchbar
      - run: shellcheck scripts/*.sh
      - name: Validate source lock
        run: python3 -m json.tool sources.lock.json > /dev/null
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git . --redact --no-banner --log-opts=--all
